<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - InvestPro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="dashboard-page">

<header class="dashboard-header">

    <a href="index.html" class="logo">
        INVEST<span>PRO</span>
    </a>

    <div class="user-menu">

        <span id="welcomeUser">
            Welcome
        </span>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</header>


<main class="dashboard">

    <div class="dashboard-title">

        <span>MY DASHBOARD</span>

        <h1>
            Welcome to your account
        </h1>

        <p>
            Manage your account and explore available plans.
        </p>

    </div>


    <div class="dashboard-cards">

        <div class="dash-card">

            <small>Account Balance</small>

            <strong id="balanceVal">$0.00</strong>

        </div>


        <div class="dash-card">

            <small>Active Investment</small>

            <strong id="investVal">$0.00</strong>

        </div>


        <div class="dash-card">

            <small>Referral Bonus</small>

            <strong id="bonusVal">$0.00</strong>

        </div>

    </div>


    <div class="dashboard-action">

        <h2>
            Explore Investment Plans
        </h2>

        <p>
            Login users can review the available plans.
        </p>

        <a href="investment.html"
           class="btn btn-primary btn-large">

            View Investment Plans →

        </a>

    </div>


    <!-- MY DEPOSITS -->
    <div class="my-deposits">

        <h2>My Deposits</h2>

        <div class="table-box" id="myDeposits"></div>

    </div>

</main>


<script src="app.js"></script>

<script>

    var DEP_KEY = "investpro_deposits";

    function money(n) {
        return "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                                         .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function fmtDate(d) {
        var x = new Date(d);
        return isNaN(x) ? "-" : x.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    function loadDeposits() {
        try { return JSON.parse(localStorage.getItem(DEP_KEY) || "[]"); } catch (e) { return []; }
    }

    function renderDeposits() {

        var list = loadDeposits();

        // Approved deposits count as active investment
        var approved = list
            .filter(function (d) { return d.status === "Approved"; })
            .reduce(function (sum, d) { return sum + Number(d.amount || 0); }, 0);

        document.getElementById("investVal").textContent = money(approved);

        var box = document.getElementById("myDeposits");

        if (!list.length) {
            box.innerHTML = '<div class="empty">No deposits yet. <a href="investment.html" style="color:var(--gold-light);font-weight:600;">Choose a plan</a> to get started.</div>';
            return;
        }

        var html = "<table><thead><tr><th>DATE</th><th>PLAN</th><th>METHOD</th><th>AMOUNT</th><th>STATUS</th></tr></thead><tbody>";

        list.slice().reverse().forEach(function (d) {
            var status = d.status || "Pending";
            html += "<tr>" +
                "<td class='muted'>" + fmtDate(d.date) + "</td>" +
                "<td>" + esc(d.plan) + "</td>" +
                "<td class='muted'>" + esc(d.method) + "</td>" +
                "<td><b>" + money(d.amount) + "</b></td>" +
                "<td><span class='badge " + esc(status) + "'>" + esc(status) + "</span></td>" +
                "</tr>";
        });

        box.innerHTML = html + "</tbody></table>";
    }

    renderDeposits();

    // Refresh when admin changes a status (other tab) or when user returns to this tab
    window.addEventListener("storage", renderDeposits);
    document.addEventListener("visibilitychange", function () {
        if (!document.hidden) renderDeposits();
    });

</script>

</body>
</html>
